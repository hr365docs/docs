function save() {

    const t1 = document.getElementById("t1").value || "";
    const t2 = document.getElementById("t2").value || "";
    const n1 = document.getElementById("n1").value || "";
    const m1=document.getElementById("m1").value || "";
    details.length = 0;
    stepDetails.length=0;
    descriptions.length=0;
    document.querySelectorAll(".itemInput").forEach(input => {
        if (input.value.trim() !== "") {
            details.push(input.value);
        }
    });
    const allHeadings =
        document.querySelectorAll(".headdd");

    const allDescriptions =
        document.querySelectorAll(".descript");

    for (let i = 0; i < allHeadings.length; i++) {

    stepDetails.push({
        heading: allHeadings[i].value,
        description: allDescriptions[i]?.value || ""
    });
    }
    document.querySelectorAll(".description1").forEach(input => {
        if(input.value.trim() !== ""){
            descriptions.push(input.value);
        }
    })
      document.querySelectorAll(".description2").forEach(input => {
        if(input.value.trim() !== ""){
            descriptions1.push(input.value);
        }
    })
     document.querySelectorAll(".trouble").forEach(input => {
        if(input.value.trim() !== ""){
            troubles.push(input.value);
        }
    })
    

    sla(t1, t2, n1, details,stepDetails,descriptions,descriptions1,troubles,m1);
}
